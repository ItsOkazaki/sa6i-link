<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0a13">
  <title>Sa6i Link</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #0b0a13; color: #f4f0ff; font-family: system-ui, sans-serif; }
    main { width: min(100%, 480px); padding: 48px 36px; border: 1px solid #383044; border-radius: 24px; background: radial-gradient(circle at top right, #53418b66, transparent 60%), #171320; box-shadow: 0 24px 80px #0006; }
    .mark { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: #b39aff; color: #171020; font-size: 30px; font-weight: bold; }
    h1 { margin: 32px 0 12px; font-size: clamp(38px, 8vw, 56px); letter-spacing: -.06em; }
    h1 span { color: #bba5ff; }
    p { margin: 0; color: #bdb4cf; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">↗</div>
    <h1>Sa6i <span>Link.</span></h1>
    <p>Our website is coming soon.</p>
  </main>
</body>
</html>
