# SPDX-License-Identifier: GPL-3.0-or-later
# Recover the difference between two public CI artifacts, not cleaner data.
name: Sa6i Clean build delta investigation
on:
  push:
    branches: [arena/077ce3b0-sa6i-link]
    paths: ['.github/workflows/sa6i-clean-build-delta.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  transfer:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: sa6i-clean-win7-integration-investigation
          path: before
          run-id: 44749974030
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          name: sa6i-clean-win7-integration-investigation
          path: after
          run-id: 44757980827
          github-token: ${{ github.token }}
      - name: Verify inputs and compute deltas
        shell: pwsh
        run: |
          python -m pip install bsdiff4==1.2.6
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install bsdiff4' }
          @'
          from pathlib import Path
          import bsdiff4, hashlib
          old, new = Path('before'), Path('after')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          a = {str(p.relative_to(old)): sha(p) for p in old.rglob('*') if p.is_file()}
          b = {str(p.relative_to(new)): sha(p) for p in new.rglob('*') if p.is_file()}
          changed = {k for k in a.keys() | b.keys() if a.get(k) != b.get(k)}
          if changed != {'nectarlink-desktop.exe', 'nectarlink_vcam.dll'}: raise SystemExit(f'Unexpected differences: {changed}')
          expected = {
            'nectarlink-desktop.exe': ('374a70ccdb7ff5185b4f6d799036387649b7f7ff3988f3bc7ee972b7662f870d', '3539aa09472b9d0f65c8b4ce546969cbd34c90c4359399880beb84486b5cb1bb', '79c6021e1e4c037736586233417cb7d06596ab6d2b2c3ab7a85d576bf024ee6a', 'desktop.delta'),
            'nectarlink_vcam.dll': ('cb86fd388b7e47ff01132193d1e8f49812387ba3a77236019d53af78a12d8ced', '0d6398f8c2e6ca11339753c3882c51b1eebd89355b187475f31e152b4f8ffed4', '53cbb1ea355fc5eb58a02b94bbb8bad9b19e848e060751419842f84cb242eae7', 'vcam.delta'),
          }
          for name, (old_sha, new_sha, delta_sha, output) in expected.items():
              if a[name] != old_sha or b[name] != new_sha: raise SystemExit('Unexpected binary hash: ' + name)
              patch = bsdiff4.diff((old/name).read_bytes(), (new/name).read_bytes())
              if hashlib.sha256(patch).hexdigest() != delta_sha: raise SystemExit('Unexpected delta hash: ' + name)
              Path(output).write_bytes(patch)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Delta verification failed' }
      - name: Emit segment 1
        shell: pwsh
        env:
          SEGMENT: 0
          GROUP: ${{ matrix.group }}
        run: &emit |
          @'
          import base64, os
          from pathlib import Path
          text = base64.b64encode(Path('desktop.delta').read_bytes()).decode('ascii')
          pieces = [text[i:i+3900] for i in range(0, len(text), 3900)]
          if len(pieces) > 120: raise SystemExit('Desktop delta too large')
          first = int(os.environ['GROUP']) * 40 + int(os.environ['SEGMENT']) * 10
          for i in range(first, min(first+10, len(pieces))):
              print(f'::notice::SA6I-DESKTOP-{i:03d}-{len(pieces):03d}:{pieces[i]}')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Desktop transfer failed' }
      - name: Emit segment 2
        shell: pwsh
        env:
          SEGMENT: 1
          GROUP: ${{ matrix.group }}
        run: *emit
      - name: Emit segment 3
        shell: pwsh
        env:
          SEGMENT: 2
          GROUP: ${{ matrix.group }}
        run: *emit
      - name: Emit segment 4
        shell: pwsh
        env:
          SEGMENT: 3
          GROUP: ${{ matrix.group }}
        run: *emit
      - name: Emit virtual camera delta
        if: matrix.group == 2
        shell: pwsh
        run: |
          @'
          import base64
          from pathlib import Path
          text = base64.b64encode(Path('vcam.delta').read_bytes()).decode('ascii')
          if len(text) > 3900: raise SystemExit('Camera delta is too large')
          print(f'::notice::SA6I-VCAM-000-001:{text}')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Camera transfer failed' }
