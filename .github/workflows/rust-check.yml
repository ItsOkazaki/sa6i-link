# SPDX-License-Identifier: GPL-3.0-or-later
name: Rust check

# Why this exists next to ci.yml. The machine this repository is worked from has no
# Rust, no Qt, no Windows and no Android toolchain, and a job's log download is served
# from blob storage that same machine cannot reach - so a compile run there is
# invisible, and an invisible compile is the same as no compile. This workflow compiles
# the crates that need neither Qt nor the NDK, and publishes what the compiler said
# into one rolling issue, which the API does serve. It answers one question only: does
# the Rust build. ci.yml stays the thing that judges a release.

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "core/**"
      - "tools/xtask/**"
      - "desktop/vcam/**"
      - ".github/workflows/rust-check.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rust-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Compile and test what needs no Qt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Say which compiler this is
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Compile every target of every crate with no Qt in it
        run: |
          set +e
          {
            echo "## toolchain"
            rustc --version || true
            cargo --version || true
            echo
            echo "## cargo check --locked --all-targets"
            cargo check --locked --all-targets --keep-going \
              -p sa6i-link-protocol -p sa6i-link-core -p sa6i-link-ffi \
              -p sa6i-link-cli -p sa6i-link-adb -p sa6i-link-intel \
              -p sa6i-link-intel-win -p xtask 2>&1
            echo "EXIT:check:$?"
            echo
            echo "## cargo test --locked"
            cargo test --locked --no-fail-fast \
              -p sa6i-link-protocol -p sa6i-link-core -p sa6i-link-cli \
              -p sa6i-link-adb -p sa6i-link-intel -p sa6i-link-intel-win 2>&1
            echo "EXIT:test:$?"
          } > report.txt
          # The step itself always succeeds: publishing is the next step's job, and the
          # exit codes are recorded above where nothing can swallow them.
          exit 0

      - name: Publish the errors into one rolling issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Rust check - $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo "Commit [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) ·"
            echo "[\`cargo check\`](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) ·"
            echo "exit codes: \`$(grep -o 'EXIT:[a-z]*:[0-9]*' report.txt | tr '\n' ' ')\`"
            echo
            echo "#### What the compiler refused"
            echo '```text'
            grep -E -A 5 '^(error(\[E[0-9]+\])?|warning: unused)' report.txt | head -260 || true
            echo '```'
            echo
            echo "#### The last thirty lines"
            echo '```text'
            tail -30 report.txt
            echo '```'
          } > body.md
          head -c 55000 body.md > body-cut.md
          n=$(gh issue list --search 'in:title "Rust check"' --json number --jq '.[0].number' || true)
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file body-cut.md
            echo "updated issue #$n"
          else
            gh issue create --title "Rust check" --body-file body-cut.md
          fi

      - name: Fail when the compiler did not agree
        run: |
          codes=$(grep -o 'EXIT:[a-z]*:[0-9]*' report.txt | cut -d: -f3 | sort -u | tr '\n' ' ')
          echo "exit codes: $codes"
          if grep -q 'EXIT:[a-z]*:[1-9]' report.txt; then
            echo "something did not compile or did not pass; issue carries the text"
            exit 1
          fi
