# SPDX-License-Identifier: GPL-3.0-or-later
# Real Qt app and real Win32 API with a synthetic, non-destructive window.
# Binary pin replacement is ephemeral and must never be distributed.
name: Sa6i Clean full window synthetic smoke
on:
  push:
    branches: [arena/077ce3b0-sa6i-link]
    paths:
      - '.github/workflows/sa6i-clean-full-window-smoke.yml'
      - 'sa6i/clean/tests/full_window_smoke.ps1'
      - 'sa6i/clean/tests/prepare_synthetic_desktop.py'
      - 'sa6i/clean/tests/real_windows_fixture.c'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  ui:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: sa6i-clean-win7-integration-investigation
          path: app
          run-id: 44757980827
          github-token: ${{ github.token }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build inert fixture, patch test copy and exercise app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'sa6i-synthetic-full-ui'
          New-Item -ItemType Directory -Path (Join-Path $fixture 'resources') -Force | Out-Null
          $fixtureExe = Join-Path $fixture 'Sa6i Clean Integration.exe'
          & cl.exe /nologo /std:c11 /W4 /DUNICODE /D_UNICODE sa6i/clean/tests/real_windows_fixture.c "/Fe:$fixtureExe" /link /SUBSYSTEM:WINDOWS user32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Fixture compile failed' }
          [System.IO.File]::WriteAllText((Join-Path $fixture 'resources/app.asar'), 'inert fixture; not a real ASAR')
          python sa6i/clean/tests/prepare_synthetic_desktop.py app/nectarlink-desktop.exe $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic desktop patch failed' }
          ./sa6i/clean/tests/full_window_smoke.ps1 -AppDir app -FixtureDir $fixture
