# SPDX-License-Identifier: GPL-3.0-or-later
# Build against a third-party Qt Windows 7 backport. No release is published.
name: Sa6i Clean Windows 7 build investigation

on:
  push:
    branches: [arena/077ce3b0-sa6i-link]
    paths:
      - '.github/workflows/sa6i-clean-win7-build.yml'
      - 'desktop/**'
      - 'core/**'
      - 'sa6i/clean/native_embed.*'
      - 'sa6i/clean/qt_embed_adapter.*'
      - 'sa6i/clean/viewport_geometry.*'
      - 'scripts/package.ps1'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SA6I_CLEAN_EXPERIMENT: "1"
  # Separate full-cleaner experiment: never used by an ordinary release.
  SA6I_CLEAN_FULL_FIXTURE: "1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Download pinned Qt 6.8.3 Windows 7 backport
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'qt-win7.7z'
          $url = 'https://github.com/xanasoft/qt-builds/releases/download/v6.8.3-ssl-lgpl/qt-everywhere-6.8.3-Windows_7-MSVC2022-x86_64.7z'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = 'f1efe461b28d7758e1e68ba189d0a45c8168ac181be1ffe7013d0bbfb6ff145d'
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Third-party Qt archive checksum mismatch'
          }
          $qtDir = Join-Path $env:RUNNER_TEMP 'qt-win7'
          & 7z x $archive "-o$qtDir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Qt archive extraction failed' }
          $qmake = @(Get-ChildItem $qtDir -Recurse -File -Filter qmake.exe)
          if ($qmake.Count -ne 1) { throw "Expected one qmake.exe; found $($qmake.Count)" }
          $bin = $qmake[0].DirectoryName
          $qtRoot = Split-Path -Parent $bin
          if (-not (Test-Path (Join-Path $bin 'windeployqt.exe'))) { throw 'No windeployqt in Qt kit' }
          # Make the unpacked kit independent of the original build directory.
          Set-Content -Path (Join-Path $bin 'qt.conf') -Value "[Paths]`nPrefix=.." -Encoding ASCII
          "QMAKE=$($qmake[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QT_ROOT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $qmake[0].FullName -query
          if ($LASTEXITCODE -ne 0) { throw 'qmake query failed' }
      - name: Build and stage separately
        shell: pwsh
        run: ./scripts/package.ps1 -QtRoot $env:QT_ROOT_DIR -StageOnly
      - name: Reject a static MFTEnum2 import
        shell: pwsh
        run: |
          python -m pip install pefile==2024.8.26
          if ($LASTEXITCODE -ne 0) { throw 'Could not install PE inspection tool' }
          @'
          import pefile
          pe = pefile.PE('target/package/Nectarlink/nectarlink-desktop.exe')
          imports = {item.name for module in pe.DIRECTORY_ENTRY_IMPORT for item in module.imports}
          if b'MFTEnum2' in imports:
              raise SystemExit('MFTEnum2 must not be a static import on Windows 7')
          if b'MFTEnumEx' not in imports:
              raise SystemExit('Expected the older MFTEnumEx fallback import')
          print('No static MFTEnum2 import; MFTEnumEx fallback is present')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Windows 7 import check failed' }
      - name: Verify full-fixture linkage
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          data = Path('target/package/Nectarlink/nectarlink-desktop.exe').read_bytes()
          checks = (
              'Sa6i Clean Integration.exe'.encode('utf-16le'),
              bytes.fromhex('04f2c19923f356fa83f7f5a5e7d074ca3df70020e755204ab63c023d5afd70e9'),
              bytes.fromhex('498f73db929e0c3564148ea93e59f28aeab0694642b639285bd4576b83f60112'),
          )
          if not all(check in data for check in checks):
              raise SystemExit('Full-cleaner fixture markers missing from the desktop binary')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Full fixture linkage verification failed' }
      - name: Check startup and approved quit on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'target/package/Nectarlink/nectarlink-desktop.exe').Path
          $data = Join-Path $env:RUNNER_TEMP 'sa6i-check-data'
          $cleaner = Join-Path $env:RUNNER_TEMP 'no-cleaner-launched'
          New-Item -ItemType Directory -Path $data | Out-Null
          $stderr = Join-Path $env:RUNNER_TEMP 'sa6i-check-stderr.txt'
          $env:NECTARLINK_NO_ADB = '1'
          $env:QT_QUICK_BACKEND = 'software'
          $app = Start-Process $exe -ArgumentList '--ui-check', '--data-dir', "`"$data`"", "`"--sa6i-clean-test-dir=$cleaner`"" -RedirectStandardError $stderr -PassThru
          $null = $app.Handle
          if (-not $app.WaitForExit(60000)) {
            $app.Refresh()
            Write-Host "::error::App did not quit. Responding=$($app.Responding); title=$($app.MainWindowTitle)"
            Get-Content $stderr -Tail 20 -ErrorAction SilentlyContinue | ForEach-Object { if ($_) { Write-Host "::error::$_" } }
            $app.Kill()
            throw 'Startup/quit check timed out'
          }
          $log = Get-Content $stderr -Raw
          if ($log) { Write-Host $log }
          if ($app.ExitCode -ne 0) { throw "Startup/quit check failed: $($app.ExitCode)" }
          if ($log -notmatch 'no QML warnings') { throw 'Expected successful UI check marker missing' }
      - name: Mark artifact limitations
        shell: pwsh
        run: |
          @'
          SA6I CLEAN WIN7 INTEGRATION INVESTIGATION — NOT A RELEASE

          This is an experimental source build using a third-party Qt 6.8.3
          Windows 7 backport, not the official Qt kit. It is not equivalent to
          the published Sa6i Link executable and has not been run on Windows 7.
          The artifact does not include the cleaner runtime. This build is
          configured for the exact full cleaner fixture, whose cleanup and
          management features can permanently delete files or change the OS.
          Do not install over an existing copy or use it for real cleanup.
          Third-party Qt licensing and runtime compatibility need review
          before distribution.
          '@ | Set-Content -Encoding UTF8 target/package/Nectarlink/INTEGRATION-BUILD-ONLY.txt
      - uses: actions/upload-artifact@v7
        with:
          name: sa6i-clean-win7-integration-investigation
          path: target/package/Nectarlink/
          if-no-files-found: error
          retention-days: 7
