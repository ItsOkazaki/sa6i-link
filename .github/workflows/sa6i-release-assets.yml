# SPDX-License-Identifier: GPL-3.0-or-later
# Attach the Sa6i Link Windows v8 test ZIP + checksums to a GitHub Release.
#
# GitHub-hosted runners are blocked by the account's billing/spending limit,
# so this job runs on a free self-hosted runner instead. Self-hosted runners
# do not consume billed Actions minutes and can reach uploads.github.com from
# the owner's own network. See sa6i/SELF-HOSTED-RUNNER.md for setup.
name: Attach Sa6i Link release assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sa6i-release-assets.yml

permissions:
  contents: write

jobs:
  attach:
    name: Verify and attach Windows v8 assets
    runs-on: self-hosted
    env:
      GH_TOKEN: ${{ github.token }}
      # Stable ID of release `sa6i-windows-arabic-v8-test`; avoids needing jq
      # or the gh CLI on the runner just to discover upload_url.
      RELEASE_ID: "447714019"
    steps:
      - uses: actions/checkout@v7

      - name: Confirm the vendored files exist
        shell: bash
        run: |
          set -euo pipefail
          test -f "sa6i/fallback/Sa6i-Link-Windows-Arabic-v8-Reviewed-TEST.zip"
          test -f "sa6i/fallback/SHA256SUMS.txt"
          echo "Both vendored files are present."

      - name: Upload both assets with curl (no gh CLI needed)
        shell: bash
        run: |
          set -euo pipefail
          base="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets"
          for f in \
            "sa6i/fallback/Sa6i-Link-Windows-Arabic-v8-Reviewed-TEST.zip" \
            "sa6i/fallback/SHA256SUMS.txt"; do
            name="$(basename "$f")"
            echo "Uploading $name"
            curl -fSsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              -H "Accept: application/vnd.github+json" \
              --data-binary "@$f" \
              "$base?name=$name" > /dev/null
          done
          echo "Both assets attached."
